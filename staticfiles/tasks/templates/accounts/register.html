{% extends "base.html" %}

{% block title %}Cadastro | TaskFlow{% endblock %}

{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 450px;">
    <div class="card-body p-4">
        <h1 class="h3 mb-4">Criar conta</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary w-100">
                Cadastrar
            </button>
        </form>

        <p class="mt-3 mb-0">
            Já tem uma conta?
            <a href="{% url 'login' %}">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
