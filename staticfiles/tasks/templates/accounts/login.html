{% extends "base.html" %}

{% block title %}Login | TaskFlow{% endblock %}

{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 450px;">
    <div class="card-body p-4">
        <h1 class="h3 mb-4">Entrar</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <p class="mt-3 mb-0">
            Ainda não tem conta?
            <a href="{% url 'register' %}">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
